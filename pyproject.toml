[project]
name = "agent-incident-lab"
version = "0.1.0"
description = "Tool-driven Incident Investigation Agent on Qwen2.5-7B"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "httpx>=0.25",
    "langfuse>=2.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "tools*", "environment*", "providers*", "evaluation*", "scripts*"]
exclude = ["data*", "configs*", "reports*", "experiments*", "observability*", "runtime*", "tests*"]
